<div
  [ngClass]="{
    'list-group-item-success': stats !== 'Absent',
    'list-group-item-danger': stats === 'Absent',
  }"
  class="list-group-item d-flex flex-wrap gap-2"
>
  <span class="text-primary">Nom :</span>
  <span>{{ lastName }}</span>

  <span class="text-primary">Prénom :</span>
  <span>{{ firstName }}</span>

  <span class="text-primary">Commentaire :</span>
  <span>{{ comment }}</span>

  <span class="text-primary">Statut :</span>
  <span>{{ stats }}</span>

  <button
    type="button"
    class="btn btn-danger"
    [disabled]="stats === 'Absent'"
    (click)="setAbsent()"
  >
    Absent
  </button>
  <button
    type="button"
    class="btn btn-success"
    [disabled]="stats !== 'Absent'"
    (click)="setPresent()"
  >
    Présent
  </button>
</div>
