<div
  [ngClass]="{
    'list-group-item-success': stats !== 'Absent',
    'list-group-item-danger': stats === 'Absent',
  }"
  class="list-group-item student-row"
>
  <div class="student-info">
    <strong class="student-name">{{ firstName }} {{ lastName }}</strong>
    <span class="student-comment">{{ comment }}</span>
  </div>

  <div class="student-status">
    <span class="status-label">{{ stats }}</span>
    @if (absenceCount > 0) {
      <small class="absence-count">Absent {{ absenceCount }} fois</small>
    }
    @if (lastUpdated) {
      <small class="updated-at">Mis à jour le {{ lastUpdated }}</small>
    }
  </div>

  <div class="student-actions">
    <button
      type="button"
      class="btn btn-sm btn-outline-danger"
      [disabled]="stats === 'Absent' || absentButtonDisabled"
      (click)="setAbsent()"
    >
      Absent
    </button>
    <button
      type="button"
      class="btn btn-sm btn-outline-success"
      [disabled]="stats !== 'Absent'"
      (click)="setPresent()"
    >
      Présent
    </button>
  </div>
</div>
