<main class="container py-5" role="main">
  <div class="card-container mt-4">
    <div class="text-center d-flex flex-column justify-content-center align-content-center gap-2">
      <h1>{{ nomSeance() }}</h1>
      <h4>{{ SeanceHint() }}</h4>
      <h4 class="bg-info">{{ resumeSeance() }}</h4>
    </div>
    <h3>Liste des étudiants</h3>
    <app-student
      [firstName]="'Alice'"
      [lastName]="'Martin'"
      [stats]="'Absent'"
      [comment]="seanceComment"
    ></app-student>
    <app-student
      [firstName]="'Bob'"
      [lastName]="'Durand'"
      [stats]="'Absent'"
      [comment]="seanceComment"
    ></app-student>
    <app-student
      [firstName]="'Claire'"
      [lastName]="'Petit'"
      [stats]="'Absent'"
      [comment]="seanceComment"
    ></app-student>
  </div>
  <div class="card-container mt-4">
    <input type="text" [(ngModel)]="seanceComment" placeholder="Comment" />
    <p>{{ seanceComment }}</p>
    <button class="btn btn-success" [disabled]="!isAuth" (click)="rendTousPres()">
      Tous présents
    </button>
  </div>
</main>
