<main class="container py-5" role="main">
  <div class="card-container mt-4">
    <div class="text-center d-flex flex-column justify-content-center align-content-center gap-2">
      <h1>{{ nomSeance() }}</h1>
      <h4>{{ SeanceHint() }}</h4>
      <h4 class="bg-info">{{ resumeSeance() }}</h4>
    </div>
    <h3>Liste des étudiants</h3>
    <div class="list-group">
      <app-student
        *ngFor="let student of students"
        [firstName]="student.firstName"
        [lastName]="student.lastName"
        [stats]="student.stats"
        [comment]="student.comment"
        (statsChange)="updateStudentStatus(student, $event)"
      ></app-student>
    </div>
  </div>
  <div class="card-container mt-4">
    <input type="text" [(ngModel)]="seanceComment" placeholder="Comment" />
    <p>{{ seanceComment }}</p>
    <button class="btn btn-success" [disabled]="!isAuth" (click)="setAllPresent()">
      Tous présents
    </button>
  </div>
</main>
