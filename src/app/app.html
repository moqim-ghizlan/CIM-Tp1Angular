<main class="container py-5" role="main">
  <section class="text-center">
    <h1 class="">{{ nomSeance() }}</h1>
    <h3 class="text-success">{{ SeanceHint() }}</h3>
    <span class="bg-info fw-bold m-0 p-0 w-auto">{{ resumeSeance() }}</span>
    <div class="card-container mt-4">
      <div class="row">
        <div class="col-xs-12">
          <h2>Liste étudiants</h2>
          <ul>
            <app-student firstName="Alice" lastName="Martin" status="Absent"></app-student>
            <app-student firstName="Bob" lastName="Durand" status="Absent"></app-student>
            <app-student firstName="Claire" lastName="Petit" status="Absent"></app-student>
          </ul>
          <button class="btn btn-success" [disabled]="!isAuth" (click)="rendTousPres()">
            Tous présents
          </button>
        </div>
      </div>
    </div>
  </section>
</main>
